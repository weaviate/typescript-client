on:
  push:
    branches:
      - main
    tags:
      - "**"
  pull_request:

env:
  WEAVIATE_133: 1.33.18
  WEAVIATE_134: 1.34.20
  WEAVIATE_135: 1.35.23
  WEAVIATE_136: 1.36.19
  WEAVIATE_137: 1.37.10
  WEAVIATE_138: 1.38.2
  WEAVIATE_139: 1.39.0-rc.0

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: 24
          cache: 'pnpm'
      - name: "Run checks"
        run: |
          npm run generate:version
          npm run ci:checks
          npm run lint
          npm run format:check
          npm run docs
          npm run build
          npm run stage:client
          npm run release:pack
      - name: "Upload tested release tarballs"
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarballs
          path: ./stage/tarballs/*.tgz
          if-no-files-found: error
      - name: "Upload docs as pages artifact"
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./docs

  tests-without-auth:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        versions:
          [
            { node: "24.x", weaviate: $WEAVIATE_133 },
            { node: "24.x", weaviate: $WEAVIATE_134 },
            { node: "24.x", weaviate: $WEAVIATE_135 },
            { node: "24.x", weaviate: $WEAVIATE_136 },
            { node: "24.x", weaviate: $WEAVIATE_137 },
            { node: "22.x", weaviate: $WEAVIATE_138 },
            { node: "24.x", weaviate: $WEAVIATE_138 },
            { node: "24.x", weaviate: $WEAVIATE_139 },
          ]
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10
    - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
      with:
        node-version: ${{ matrix.versions.node }}
        cache: 'pnpm'
    - name: Login to Docker Hub
      if: ${{ !github.event.pull_request.head.repo.fork && github.triggering_actor != 'dependabot[bot]' }}
      uses: docker/login-action@v3
      with:
        username: ${{secrets.DOCKER_USERNAME}}
        password: ${{secrets.DOCKER_PASSWORD}}
    - name: "Install dependencies"
      run: |
        npm run ci:test
        ci/run_dependencies.sh ${{ matrix.versions.weaviate }}
    - name: "Run tests without authentication tests"
      run: WEAVIATE_VERSION=${{ matrix.versions.weaviate }} npm run test
    - name: "Stop Weaviate"
      run: ci/stop_dependencies.sh ${{ matrix.versions.weaviate }}

  tests-with-auth:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        versions: [{ node: "24.x", weaviate: $WEAVIATE_138 }]
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10
    - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
      with:
        node-version: ${{ matrix.versions.node }}
    - name: Login to Docker Hub
      if: ${{ !github.event.pull_request.head.repo.fork && github.triggering_actor != 'dependabot[bot]' }}
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
      with:
        username: ${{secrets.DOCKER_USERNAME}}
        password: ${{secrets.DOCKER_PASSWORD}}
    - name: "Install dependencies"
      run: |
        npm run ci:test
        ci/run_dependencies.sh ${{ matrix.versions.weaviate }}
    - name: "Run tests with authentication tests"
      if: ${{ !github.event.pull_request.head.repo.fork }}
      env:
        OKTA_DUMMY_CI_PW: ${{ secrets.OKTA_DUMMY_CI_PW }}
        WCS_DUMMY_CI_PW: ${{ secrets.WCS_DUMMY_CI_PW }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        OKTA_CLIENT_SECRET: ${{ secrets.OKTA_CLIENT_SECRET }}
      run: WEAVIATE_VERSION=${{ matrix.versions.weaviate }} npm run test
    - name: "Stop Weaviate"
      run: ci/stop_dependencies.sh ${{ matrix.versions.weaviate }}

  release-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: 24
      - name: "Validate alpha release tag"
        id: validate
        run: npm run release:check

  publish:
    needs: [checks, tests-with-auth, tests-without-auth, release-tag]
    if: needs.release-tag.outputs.version != ''
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.release-tag.outputs.version }}
    permissions:
      contents: write # to upload the release
      pages: write # to deploy to Pages
      id-token: write # to authenticate with OIDC when publishing to npm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: "Install npm with trusted publishing support"
        run: npm install --global npm@11.8.0
      - name: "Download tested release tarballs"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarballs
          path: ./stage/tarballs
      - name: "Dry-run publication"
        run: npm run release:publish:dry-run
      - name: "Publish release tarballs"
        run: npm run release:publish
      - name: "Deploy the uploaded pages artifact"
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: "Create a GitHub release"
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          generate_release_notes: true
          draft: true
          prerelease: true

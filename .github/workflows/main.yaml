on:
  push:
    branches:
      - main
      - weaviate-client
    tags:
      - "**"
  pull_request:

env:
  WEAVIATE_133: 1.33.18
  WEAVIATE_134: 1.34.20
  WEAVIATE_135: 1.35.16
  WEAVIATE_136: 1.36.10
  WEAVIATE_137: 1.37.5
  WEAVIATE_138: 1.38.2

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: "24.x"
      - name: "Run checks"
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run docs

  tests-without-auth:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        versions:
          [
            { node: "24.x", weaviate: $WEAVIATE_133 },
            { node: "24.x", weaviate: $WEAVIATE_134 },
            { node: "24.x", weaviate: $WEAVIATE_135 },
            { node: "24.x", weaviate: $WEAVIATE_136 },
            { node: "24.x", weaviate: $WEAVIATE_137 },
            { node: "22.x", weaviate: $WEAVIATE_138 },
            { node: "24.x", weaviate: $WEAVIATE_138 },
          ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: ${{ matrix.versions.node }}
      - name: Login to Docker Hub
        if: ${{ !github.event.pull_request.head.repo.fork && github.triggering_actor != 'dependabot[bot]' }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: "Install dependencies"
        run: |
          npm ci
          ci/run_dependencies.sh ${{ matrix.versions.weaviate }}
      - name: "Run tests without authentication tests"
        run: WEAVIATE_VERSION=${{ matrix.versions.weaviate }} npm test
      - name: "Transpile the package"
        run: npm run build
      - name: "Stop Weaviate"
        run: ci/stop_dependencies.sh ${{ matrix.versions.weaviate }}

  tests-with-auth:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        versions: [{ node: "24.x", weaviate: $WEAVIATE_138 }]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: ${{ matrix.versions.node }}
      - name: Login to Docker Hub
        if: ${{ !github.event.pull_request.head.repo.fork && github.triggering_actor != 'dependabot[bot]' }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: "Install dependencies"
        run: |
          npm ci
          ci/run_dependencies.sh ${{ matrix.versions.weaviate }}
      - name: "Run tests with authentication tests"
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          OKTA_DUMMY_CI_PW: ${{ secrets.OKTA_DUMMY_CI_PW }}
          WCS_DUMMY_CI_PW: ${{ secrets.WCS_DUMMY_CI_PW }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          OKTA_CLIENT_SECRET: ${{ secrets.OKTA_CLIENT_SECRET }}
        run: WEAVIATE_VERSION=${{ matrix.versions.weaviate }} npm test
      - name: "Stop Weaviate"
        run: ci/stop_dependencies.sh ${{ matrix.versions.weaviate }}

  publish:
    needs: [tests-with-auth, tests-without-auth]
    # wc-vM.m.p tags release weaviate-client from this branch; main's v* tags release the @weaviate/* packages.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/wc-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # to upload the release
      id-token: write # to authenticate with OIDC when publishing to npm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - name: "Validate release tag"
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^wc-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag $TAG is not of the form wc-vM.m.p"; exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "${TAG#wc-v}" != "$version" ]; then
            echo "Tag $TAG does not match package.json version $version"; exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm publish
      - name: "Create a GitHub release"
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          generate_release_notes: true
          draft: true

---
version: "3.4"
services:
  weaviate-rbac:
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8085"
      - --scheme
      - http
      - --write-timeout=600s
    image: semitechnologies/weaviate:${WEAVIATE_VERSION}
    ports:
      - 8091:8085
      - 50062:50051
    restart: on-failure:0
    environment:
      # backup-filesystem is enabled here so that backup behaviour which Weaviate only exposes to
      # root users (e.g. incremental_base_backup_id) can be tested; ci/docker-compose-backup.yml
      # is anonymous and therefore never has a root caller.
      ENABLE_MODULES: "generative-dummy,reranker-dummy,backup-filesystem"
      BACKUP_FILESYSTEM_PATH: "/tmp/backups"
      PERSISTENCE_DATA_PATH: "./data-weaviate-0"
      CLUSTER_IN_LOCALHOST: "true"
      CLUSTER_GOSSIP_BIND_PORT: "7100"
      CLUSTER_DATA_BIND_PORT: "7101"
      RAFT_BOOTSTRAP_EXPECT: "1"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: "viewer-key,editor-key,admin-key,custom-key"
      AUTHENTICATION_APIKEY_USERS: "viewer-user,editor-user,admin-user,custom-user"
      AUTHORIZATION_RBAC_ENABLED: "true"
      AUTHORIZATION_ADMIN_USERS: "admin-user"
      AUTHORIZATION_VIEWER_USERS: "viewer-user"
      AUTHENTICATION_DB_USERS_ENABLED: "true"
      AUTHENTICATION_OIDC_ENABLED: "true"
      AUTHENTICATION_OIDC_CLIENT_ID: "Peuc12y02UA0eAED1dqSjE5HtGUrpBsx"
      AUTHENTICATION_OIDC_ISSUER: "https://auth.weaviate.cloud/Peuc12y02UA0eAED1dqSjE5HtGUrpBsx"
      AUTHENTICATION_OIDC_USERNAME_CLAIM: "email"
      AUTHENTICATION_OIDC_GROUPS_CLAIM: "groups"
...
